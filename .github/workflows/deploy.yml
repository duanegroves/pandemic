name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - name: Python lint and tests
        run: |
          uv sync --all-extras --python 3.12
          uv run ruff check
          uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend tests and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  build:
    # Only build/push images for pushes to main (and manual runs), not for pull requests.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (ghcr requires lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Multi-arch, so the same image runs on Oracle's Ampere A1 (arm64) and the x86
          # E2.1.Micro (amd64) Always Free shapes. Override with the DOCKER_PLATFORMS variable.
          platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64,linux/arm64' }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Skipped until the VM is set up: set the repository variable DEPLOY_ENABLED=true.
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/Caddyfile
          target: ~/pandemic
          strip_components: 1

      - name: Pull the new image and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS || ':80' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: IMAGE,SITE_ADDRESS,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd ~/pandemic
            printf 'IMAGE=%s\nSITE_ADDRESS=%s\n' "$IMAGE" "$SITE_ADDRESS" > .env
            # The job token is short-lived; it is only used for this pull.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            docker compose ps

  deploy-cloudflare:
    # Skipped until the Worker is set up: set the repository variable CLOUDFLARE_ENABLED=true and
    # the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. See docs/CLOUDFLARE.md.
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      # pywrangler needs uv >= 0.13.4.
      - uses: astral-sh/setup-uv@v5
        with:
          version: ">=0.13.4"

      - name: Copy engine and frontend into the Worker
        run: cloudflare/worker/scripts/sync.sh

      - name: Deploy the Worker
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy
