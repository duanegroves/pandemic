[project]
name = "pandemic"
version = "0.1.0"
description = "Cooperative Pandemic board game: rules engine, RL environments and a multiplayer web server (unofficial fan project)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]
ai = [
    "gymnasium>=1.4.0",
    "numpy>=2.4.6",
    "pettingzoo>=1.27.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "httpx>=0.28.1",
]
# The server and ai extras are installed with `uv sync --all-extras` (used by CI and CLAUDE.md).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pandemic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
disable_error_code = ["annotation-unchecked"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["pettingzoo", "pettingzoo.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
# Generated copies/vendored files inside the Worker (see cloudflare/worker/scripts/sync.sh).
extend-exclude = [
    "cloudflare/worker/src/pandemic",
    "cloudflare/worker/python_modules",
    "cloudflare/worker/public",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["UP042"]  # keep (str, Enum): str() of members must stay stable

[tool.ruff.lint.isort]
known-first-party = ["pandemic"]
known-local-folder = ["helpers"]
