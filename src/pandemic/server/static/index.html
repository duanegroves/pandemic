<!doctype html>
<html><head><meta charset="utf-8"><title>Pandemic debug client</title>
<style>
body{font:13px monospace;margin:8px;max-width:1100px}
pre{background:#f4f4f4;padding:6px;overflow:auto;max-height:260px}
button{margin:2px;font:12px monospace}
input{font:12px monospace}
#actions button{display:inline-block}
.err{color:#b00}
</style></head><body>
<h3>Pandemic debug client</h3>
<div id="setup">
  Name <input id="name" value="player" size="8">
  Players <input id="np" type="number" value="2" min="2" max="4" style="width:3em">
  Difficulty <select id="diff"><option>introductory</option><option selected>standard</option><option>heroic</option></select>
  Timeout(s) <input id="to" size="3" placeholder="none">
  <button onclick="createRoom()">Create room</button><br>
  Room <input id="room" size="8"> <button onclick="joinRoom()">Join</button>
  <span id="who"></span>
</div>
<div id="lobby"></div>
<div>
  <button onclick="send({type:'ready'})">Ready</button>
  <button onclick="send({type:'start'})">Start (host)</button>
</div>
<h4 id="decision"></h4>
<div id="actions"></div>
<h4>Observation</h4><pre id="obs"></pre>
<h4>Events</h4><pre id="events"></pre>
<h4>Chat</h4><pre id="chat"></pre>
<input id="chatin" size="40"><button onclick="sendChat()">Send</button>
<h4>Messages</h4><pre id="msgs"></pre>
<script>
let ws=null,creds=null;
const $=id=>document.getElementById(id);
async function createRoom(){
  const body={config:{num_players:+$('np').value,difficulty:$('diff').value}};
  if($('to').value)body.timeout=+$('to').value;
  const r=await (await fetch('/rooms',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})).json();
  $('room').value=r.room_id; joinRoom();
}
async function joinRoom(){
  const room=$('room').value, saved=sessionStorage.getItem('tok-'+room);
  const res=await fetch(`/rooms/${room}/join`,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({name:$('name').value,token:saved||null})});
  if(!res.ok){alert((await res.json()).detail);return}
  creds=await res.json(); sessionStorage.setItem('tok-'+room,creds.token);
  $('who').textContent=` room ${room} seat ${creds.seat}`;
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws/${room}?token=${creds.token}`);
  ws.onmessage=e=>onMsg(JSON.parse(e.data));
  ws.onclose=()=>log('socket closed');
}
function send(o){ws&&ws.send(JSON.stringify(o))}
function sendChat(){send({type:'chat',text:$('chatin').value});$('chatin').value=''}
function log(s){$('msgs').textContent=(s+'\n'+$('msgs').textContent).slice(0,4000)}
function prepend(id,s){$(id).textContent=s+'\n'+$(id).textContent}
function onMsg(m){
  log(m.type+(m.code?' '+m.code+': '+m.message:''));
  if(m.type==='lobby')$('lobby').textContent=m.seats.map(s=>`#${s.seat} ${s.name}${s.host?' (host)':''} ready=${s.ready} online=${s.connected}`).join('\n')+`\nphase=${m.phase}`;
  else if(m.type==='chat')prepend('chat',`${m.name}: ${m.text}`);
  else if(m.type==='error')alert(m.message);
  else if(m.type==='state'){
    const o=m.observation,d=m.decision;
    $('decision').textContent=`${m.phase} | decision: ${d.kind} for seat ${d.player} ${JSON.stringify(d.context)}`
      +(m.deadline_in!=null?` | auto in ${m.deadline_in.toFixed(0)}s`:'')+(m.outcome?` | ${JSON.stringify(m.outcome)}`:'');
    const cities=Object.entries(o.cubes).map(([c,v])=>`${c}: ${JSON.stringify(v)}`).join('\n');
    const players=o.players.map(p=>`#${p.index} ${p.role} @${p.location} hand=${p.hand?p.hand.join(', '):'('+p.hand_size+' hidden)'} stored=${p.stored_event}`).join('\n');
    $('obs').textContent=`turn ${o.turn} player ${o.current_player} actions ${o.actions_remaining} outbreaks ${o.outbreaks} rate ${o.infection_rate}\ncures ${JSON.stringify(o.cures)} supply ${JSON.stringify(o.supply)}\nstations ${o.research_stations.join(', ')}\n\nPLAYERS\n${players}\n\nCUBES\n${cities}\n\n`+JSON.stringify({player_deck:o.player_deck,infection_discard:o.infection_discard},null,1);
    m.events.forEach(e=>prepend('events',JSON.stringify(e)));
    const box=$('actions');box.textContent='';
    const acts=m.legal_actions;
    acts.slice(0,200).forEach(a=>{const b=document.createElement('button');
      b.textContent=a.type+' '+Object.entries(a).filter(([k])=>k!=='type').map(([k,v])=>JSON.stringify(v)).join(' ');
      b.onclick=()=>send({type:'action',action:a});box.appendChild(b)});
    if(acts.length>200)box.append(` ...${acts.length-200} more`);
  }
}
</script></body></html>
